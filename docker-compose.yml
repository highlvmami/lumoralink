# Yerelde PostgreSQL çalıştırmak için. Başlatmak: `npm run db:up`
services:
  db:
    image: postgres:17
    container_name: link-shortener-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: link_shortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
